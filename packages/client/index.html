<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="Murim Apocalypse - a persistent isometric wuxia world in your browser." />
    <title>Murim Apocalypse</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23c8452d'/%3E%3Ctext x='32' y='47' font-size='42' text-anchor='middle' fill='%23f7e6c8' font-family='serif'%3E%E6%AD%A6%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- Ink-bleed filter that roughens the title lettering so it reads as brushwork. -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <filter id="ink-rough" x="-5%" y="-10%" width="110%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.06" numOctaves="2" seed="4" result="n" />
        <feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="app">
      <noscript>Murim Apocalypse needs JavaScript to run.</noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
